<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fbf8f2"><title>Dreamcatcher</title><link rel="stylesheet" href="./styles.css?v=20261001-31">
</head>
<body>
<div class="app-shell"><header class="topbar"><div><div class="eyebrow">DREAM JOURNAL</div><h1>Dreamcatcher</h1></div><div class="top-actions"><button id="newDreamBtn" class="icon-btn" aria-label="记录新梦">＋</button></div></header><main id="app"></main><nav class="bottom-nav" aria-label="主导航"><button class="nav-item active" data-view="home"><span>⌂</span><small>梦境</small></button><button class="nav-item" data-view="calendar"><span>◫</span><small>日历</small></button><button class="nav-item" data-view="profile"><span>♙</span><small>我的</small></button></nav></div>
<dialog id="dreamDialog"><form id="dreamForm" method="dialog"><div class="dialog-head"><div><div class="eyebrow">DREAM NOTE</div><h2 id="dialogTitle">记录梦境</h2></div><button type="button" class="icon-btn ghost" id="closeDialogBtn">×</button></div><input type="hidden" id="dreamId"><label>日期<input id="dreamDate" type="date" required></label><label>梦境标题<input id="dreamTitle" type="text" maxlength="60" placeholder="给这个梦取一个名字" required></label><label>梦境内容<textarea id="dreamContent" rows="5" maxlength="2000" placeholder="记下人物、场景、情节、颜色、声音……" required></textarea></label><fieldset><legend>梦境分类</legend><div id="categoryChoices" class="chip-grid"></div></fieldset><fieldset><legend>醒后心情（可多选）</legend><div id="moodChoices" class="chip-grid"></div></fieldset><fieldset><legend>身体感受（可多选）</legend><div id="bodyChoices" class="chip-grid"></div></fieldset><label>近期生活背景<textarea id="dreamContext" rows="3" maxlength="800" placeholder="最近发生了什么？压力、关系、学习、睡眠……"></textarea></label><label id="shareWormholeRow" class="share-toggle hidden"><span><b>分享到虫洞</b><small id="shareWormholeHint">让对方在最近的梦中看到这条记录</small></span><input id="shareWormhole" type="checkbox"></label><div class="form-actions"><button type="button" id="deleteDreamBtn" class="danger-btn hidden">删除</button><button type="submit" class="primary-btn">保存梦境</button></div></form></dialog>
<dialog id="textEntryDialog"><form id="textEntryForm" class="text-entry-panel"><div class="dialog-head"><div><div class="eyebrow">DREAMCATCHER</div><h2 id="textEntryTitle">写下评论</h2></div><button type="button" class="icon-btn ghost" id="closeTextEntryBtn">×</button></div><p id="textEntryHint" class="muted"></p><textarea id="textEntryValue" rows="5" maxlength="1000"></textarea><div class="form-actions"><button type="submit" class="primary-btn" id="textEntrySubmit">保存</button></div></form></dialog>
<dialog id="viewDreamDialog"><div id="viewDreamContent" class="dream-view-panel"></div></dialog>
<dialog id="accountDialog"><div class="account-panel"><div class="dialog-head"><div><div class="eyebrow">ACCOUNT</div><h2>Dreamcatcher 账户</h2></div><button type="button" class="icon-btn ghost" id="closeAccountBtn">×</button></div><div id="authNotConfigured" class="auth-note"><strong>正在连接账户服务…</strong><p>如果这里持续不变，请刷新页面。</p></div><div id="authForms" class="hidden"><label>邮箱<input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></label><label>密码<input id="authPassword" type="password" minlength="6" autocomplete="current-password" placeholder="至少 6 位"></label><div id="authMessage" class="auth-message"></div><div class="auth-actions"><button id="signInBtn" type="button" class="primary-btn">登录</button><button id="signUpBtn" type="button" class="secondary-btn">注册</button></div></div><div id="signedInPanel" class="hidden"><p>已登录：<strong id="signedInEmail"></strong></p><p class="muted">梦境与自定义标签已启用云端同步。</p><button id="signOutBtn" type="button" class="secondary-btn">退出登录</button></div></div></dialog>
<dialog id="confirmDialog"><div class="confirm-panel"><div class="confirm-icon">☾</div><h2 id="confirmTitle">确定退出登录？</h2><p id="confirmMessage" class="muted">退出后可以随时重新登录。</p><div class="confirm-actions"><button type="button" id="confirmCancel" class="secondary-btn">取消</button><button type="button" id="confirmOk" class="primary-btn">退出登录</button></div></div></dialog>
<dialog id="wormholeDialog"><div class="account-panel"><div class="dialog-head"><div><h2>虫洞</h2></div><button type="button" class="icon-btn ghost" id="closeWormholeBtn">×</button></div><div id="wormholeContent"></div></div></dialog>
<template id="emptyStateTemplate"><section class="empty-card"><div class="dreamcatcher-mark">◌</div><h2>还没有梦境记录</h2><p>醒来后，把还没散去的碎片留在这里。</p><button class="primary-btn" data-action="create">记录第一个梦</button></section></template>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js?v=1"></script><script src="./app.js?v=20261001-31"></script><script src="./auth.js?v=20261001-31"></script>
</body></html>
