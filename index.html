<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf8f2" />
  <title>捕梦网 Dreamcatcher</title>
  <link rel="stylesheet" href="./styles.css?v=20261001-4" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar"><div><div class="eyebrow">DREAMCATCHER</div><h1>捕梦网</h1></div><button id="newDreamBtn" class="icon-btn" aria-label="记录新梦">＋</button></header>
    <main id="app"></main>
    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-item active" data-view="home"><span>⌂</span><small>梦境</small></button>
      <button class="nav-item" data-view="calendar"><span>◫</span><small>日历</small></button>
      <button class="nav-item" data-view="insights"><span>◌</span><small>趋势</small></button>
    </nav>
  </div>
  <dialog id="dreamDialog">
    <form id="dreamForm" method="dialog">
      <div class="dialog-head"><div><div class="eyebrow">DREAM NOTE</div><h2 id="dialogTitle">记录梦境</h2></div><button type="button" class="icon-btn ghost" id="closeDialogBtn">×</button></div>
      <input type="hidden" id="dreamId" />
      <label>日期<input id="dreamDate" type="date" required /></label>
      <label>梦境标题<input id="dreamTitle" type="text" maxlength="60" placeholder="给这个梦取一个名字" required /></label>
      <label>梦境内容<textarea id="dreamContent" rows="5" maxlength="2000" placeholder="记下人物、场景、情节、颜色、声音……" required></textarea></label>
      <fieldset><legend>梦境分类</legend><div id="categoryChoices" class="chip-grid"></div></fieldset>
      <fieldset><legend>醒后心情（可多选）</legend><div id="moodChoices" class="chip-grid"></div></fieldset>
      <fieldset><legend>身体感受（可多选）</legend><div id="bodyChoices" class="chip-grid"></div></fieldset>
      <label>近期生活背景<textarea id="dreamContext" rows="3" maxlength="800" placeholder="最近发生了什么？压力、关系、学习、睡眠……"></textarea></label>
      <div class="form-actions"><button type="button" id="deleteDreamBtn" class="danger-btn hidden">删除</button><button type="submit" class="primary-btn">保存梦境</button></div>
    </form>
  </dialog>
  <template id="emptyStateTemplate"><section class="empty-card"><div class="dreamcatcher-mark">◌</div><h2>还没有梦境记录</h2><p>醒来后，把还没散去的碎片留在这里。</p><button class="primary-btn" data-action="create">记录第一个梦</button></section></template>
  <script src="./app.js?v=20261001-4"></script>
</body>
</html>
